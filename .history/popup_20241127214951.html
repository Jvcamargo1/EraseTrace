<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>EraseTrace</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      color: #333;
      padding: 10px;
    }
    #header {
      color: #cb6ce6;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .button {
      background-color: #cb6ce6;
      color: white;
      border: none;
      padding: 10px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="header">EraseTrace</div>
  <div id="sitesList"></div>
  <input type="text" id="newSite" placeholder="Adicionar novo site">
  <button id="addSite" class="button">Adicionar Site</button>
  <button id="clearHistory" class="button">Apagar Histórico</button>
  <div id="status"></div>
</body>
</html>
